aid: spectrum-medical
name: Spectrum Medical
description: >-
  Spectrum Medical is a privately held medical technology company, co-founded by Steve Turner and Mark
  Drain, with corporate headquarters in Cheltenham, England, a U.S. headquarters in Fort Mill, South
  Carolina, and a European headquarters in Mirandola, Italy. It entered the global medical device market
  in 2005 with its non-invasive System M diagnostic technology and today builds two connected product
  families: Quantum Perfusion Technologies (workstations, centrifugal and roller pumps, oxygenators,
  heater-coolers, sensor modules and single-use sterile technologies for cardiopulmonary bypass, ECMO and
  other extracorporeal therapies) and Quantum Informatics (the VIPER clinical interfacing EMR, the VISION
  server and Perfusion Information Management System). Its software surface is a customer-deployed,
  on-premise stack: the VISION server passes case data to the hospital EHR over HL7 v2 interfaces through
  a bundled Mirth Connect interface engine, and third-party device connectivity is delivered through
  optional device-driver software rather than a public web API. Spectrum Medical is ISO/IEC 27001:2013
  certified and its VIPER Clinical Information Solution 3.0 earned ONC-HIT 2014 Edition Modular
  Certification via the Drummond Group. Systems are in use in over 60 countries.
